<html>
<head>
    <title>Profile</title>
</head>
<body style="background-color: #e9ecef; font-family: Arial;">

    <a href="index.html" style="color: blue;">Go Back</a>
    <br><br>

    <div id="breed-details" style="background: white; padding: 20px; border: 1px solid black;">
        Loading...
    </div>

    <script>
        var urlSearch = window.location.search;
        var urlParams = new URLSearchParams(urlSearch);
        var breedId = urlParams.get('id');
        
        var detailsContainer = document.getElementById('breed-details');

        if (breedId == null) {
            detailsContainer.innerHTML = "No ID!";
        } else {
            fetch('https://dogapi.dog/api/v2/breeds')
                .then(function(response) {
                    return response.json();
                })
                .then(function(data) {
                    var allDogs = data.data;
                    var selectedDog = null;
                   
                    for(var i = 0; i < allDogs.length; i++) {
                        if (allDogs[i].id == breedId) {
                            selectedDog = allDogs[i];
                        }
                    }

                    if (selectedDog != null) {
                        var name = selectedDog.attributes.name;
                        var desc = selectedDog.attributes.description;
                        var minLife = selectedDog.attributes.life.min;
                        var maxLife = selectedDog.attributes.life.max;
                       
                        detailsContainer.innerHTML = "<h1>" + name + "</h1>";
                        detailsContainer.innerHTML = detailsContainer.innerHTML + "<p>Description: " + desc + "</p>";
                        detailsContainer.innerHTML = detailsContainer.innerHTML + "<hr>";
                        detailsContainer.innerHTML = detailsContainer.innerHTML + "<p>Life Span: " + minLife + " to " + maxLife + " years</p>";
                    } else {
                        detailsContainer.innerHTML = "Error! Dog not found.";
                    }
                });
        }
    </script>

</body>
</html>
