<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning about objects</title>
</head>

<body>
    <h1>Learning about objects</h1>

    <h2>Add New Person</h2>
    <input type="text" id="newName" placeholder="Enter name">
    <input type="text" id="newRole" placeholder="Enter role">
    <button onclick="addPerson()">Add Person</button>

    <h2>Directory</h2>
    <div id="directory"></div>

    <script>
        var age = 37;
        var name = "Mohammad";
        var list = [];
        var isOld = true;

        var Mohammad = {
            name: "Mohammad",
            age: 37,
            isOld: true,
            list: ['lunch', 'sourcery', 'openstudio']
        };

        console.log(Mohammad);

        var directory = [
            { name: "Mohammad", role: "student" },
            { name: "John", role: "teacher" },
            { name: "Jane", role: "coach" }
        ];

        console.log(directory[1].name);

        function renderDirectory() {
            var container = document.getElementById('directory');
            container.innerHTML = '';

            directory.forEach(function(person, index) {
                var p = document.createElement('p');
                p.textContent = person.name + ' - ' + person.role + ' ';

                var editButton = document.createElement('button');
                editButton.textContent = 'Edit';
                editButton.onclick = function() {
                    editPerson(index);
                };

                p.appendChild(editButton);
                container.appendChild(p);
            });
        }

        function addPerson() {
            var newName = document.getElementById('newName').value;
            var newRole = document.getElementById('newRole').value;

            if (newName !== '' && newRole !== '') {
                directory.push({
                    name: newName,
                    role: newRole
                });

                document.getElementById('newName').value = '';
                document.getElementById('newRole').value = '';

                renderDirectory();
            }
        }

        function editPerson(index) {
            var updatedName = prompt("Edit name:", directory[index].name);
            var updatedRole = prompt("Edit role:", directory[index].role);

            if (updatedName !== null && updatedName !== '' && updatedRole !== null && updatedRole !== '') {
                directory[index].name = updatedName;
                directory[index].role = updatedRole;

                renderDirectory();
            }
        }

        renderDirectory();
    </script>
</body>
</html>
