<html>
<head>
    <title>Dogs</title>
</head>
<body bgcolor="#f4f4f4">

    <center><h1>Dog Breeds</h1></center>
    
    <div id="dog-list"></div>

    <script>
        var dogListElement = document.getElementById('dog-list');
        
        fetch('https://dogapi.dog/api/v2/breeds')
            .then(function(response) {
                return response.json();
            })
            .then(function(data) {
                var breeds = data.data; 
                          
                for(var i = 0; i < breeds.length; i++) {
                    var currentDog = breeds[i];
                    var dogName = currentDog.attributes.name;
                    var dogId = currentDog.id;
                
                    var myHtml = "<div style='background: white; padding: 15px; margin-bottom: 10px; border: 1px solid gray;'>";
                    myHtml = myHtml + "<b>" + dogName + "</b><br><br>";
                    myHtml = myHtml + "<a href='profile.html?id=" + dogId + "'>View Profile</a>";
                    myHtml = myHtml + "</div>";

                    dogListElement.innerHTML = dogListElement.innerHTML + myHtml;
                }
            });
    </script>

</body>
</html>
